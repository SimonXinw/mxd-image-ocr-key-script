# 本项目的正式运行配置，已纳入版本控制，直接改这里。
# 每个参数的详细说明和可选值见 config.example.yaml（那份只当说明书，数值不要求与本文件一致）。
# 战斗相关参数的调参指引见 docs/combat-flow.md。

window:
  title_contains: "北斗GMS083"
  capture_region: null

model:
  weights: "models/best.pt"
  weights_dir: "models"
  # 移动怪分数会瞬间下降；适度降低阈值，再由 ByteTrack 和连续帧确认过滤闪框。
  confidence: 0.45
  image_size: 640
  device: "auto"
  # ByteTrack 给移动怪分配持续 ID，减少检测闪动时换目标。
  tracking_enabled: true
  tracker: "bytetrack.yaml"
  # mob=旧 best.pt；monster=Roboflow 原名（如刺蘑菇数据集）。两者都认，方便切换模型。
  monster_classes: ["mob", "monster"]
  player_class: "player"

player:
  locator: "hybrid"
  name_template: "assets/player_name.png"
  template_threshold: 0.82
  # 没有名字模板 / YOLO 找不到人时，假定镜头中心就是角色（冒险岛镜头通常跟角色）。
  fallback_to_frame_center: true
  # 名字搜索：水平全宽，垂直只取中间 40%，避开 UI 上的同名文字。
  search_center_x_ratio: 1.0
  search_center_y_ratio: 0.40
  template_center_offset: [0, -49]

behavior:
  profile: "warrior"
  # false = 直接真实发键。想只看识别不动手，把它改回 true 或在 GUI 勾「仅预览」。
  dry_run: false
  auto_attack_enabled: true
  startup_delay_seconds: 3
  loop_interval_seconds: 0.03
  # 怪物与人物脚底（框 bottom）的最大高度差；超过时视为不可达。
  target_vertical_tolerance: 140
  # 先选择最近怪，再持续锁定它；避免检测框抖动时左右换目标。
  target_match_radius_pixels: 120
  target_lost_grace_seconds: 0.7
  # 只追一定范围内的怪，远方误检不会把人物拉走。
  max_chase_horizontal_pixels: 420
  # 新目标连续出现 2 帧才锁定，过滤一闪而过的框。
  target_acquire_frames: 2
  # 攻击后允许目标多离开一点才追，避免在攻击边界反复走/打。
  attack_release_margin_pixels: 40
  # 移动、跳跃、巡逻需连续出现几帧才切换；攻击仍立即响应。
  action_confirm_frames: 2
  move_pulse_seconds: 0.10
  patrol_pulse_seconds: 0.35
  patrol_switch_seconds: 2.5
  # 怪物脚底比人物脚底高出多少像素，且还不在攻击范围时，触发朝目标跳跃。
  jump_when_target_above_pixels: 45
  jump_cooldown_seconds: 1.2
  debug_window: true

ui:
  target_fps: 60
  # 预览无需和识别同帧率，降低刷新可减少 GUI 画图开销。
  preview_fps: 24

profiles:
  warrior:
    attack_key: "ctrl"
    jump_key: "alt"
    left_key: "left"
    right_key: "right"
    up_key: "up"
    down_key: "down"
    hp_potion_key: "1"
    mp_potion_key: "2"
    # 战士近战：180 提前停步攻击；若实际技能经常打空可降到 160。
    attack_range_pixels: 160
    attack_cooldown_seconds: 0.40
    buffs:
      - key: "f1"
        interval_seconds: 180
  priest:
    attack_key: "ctrl"
    jump_key: "alt"
    left_key: "left"
    right_key: "right"
    up_key: "up"
    down_key: "down"
    hp_potion_key: "1"
    mp_potion_key: "2"
    # 法师/牧师远程攻击距离更长。
    attack_range_pixels: 230
    attack_cooldown_seconds: 0.75
    buffs:
      - key: "f1"
        interval_seconds: 180

collection:
  # GUI「开始截图」勾选后生效；也可单独跑 collect 命令。
  enabled: false
  output_dir: "captures"
  interval_seconds: 1.0

# 固定 ROI 读血蓝条。比例基于 1024x576 满血满蓝标定，见 assets/vitals_roi_ref.png。
vitals:
  enabled: true
  show_overlay: true
  # [left, top, width, height] 相对客户区比例
  hp_roi: [0.1709, 0.9757, 0.0840, 0.0156]
  mp_roi: [0.2559, 0.9757, 0.0830, 0.0156]
  hp_threshold: 0.40
  mp_threshold: 0.30
  cooldown_seconds: 1.0

training:
  base_model: "yolo11n.pt"
  data: "dataset/data.yaml"
  # 留空时按 data.yaml 所在文件夹命名，例如 models/dataset.pt。
  output_weights: null
  # 留空时使用输出 pt 的文件名，训练过程保存在 runs/<名称>/。
  run_name: null
  epochs: 100
  image_size: 640
  batch: 8
  workers: 4
  device: "auto"
  # 留空时自动使用 runs/<本次任务名>/weights/last.pt。
  resume_weights: null
