window:
  title_contains: "MapleStory"
  # 留空表示截取整个客户端区域；也可以限制为 [left, top, width, height]。
  # 抓图默认 mss（屏幕截取），失败才回退 PrintWindow / BitBlt。
  capture_region: null

model:
  weights: "models/best.pt"
  # 若预览里几乎没有框，先降到 0.12~0.25 观察；长期仍需用本服截图重训。
  confidence: 0.25
  image_size: 640
  # auto：优先 NVIDIA CUDA，检测不到则 CPU；也可写 cuda / cpu / 0
  device: auto
  monster_classes: ["mob"]
  player_class: "player"

player:
  # yolo：检测 player 类；template：匹配 assets/player_name.png；hybrid：优先模板，失败时用 YOLO。
  locator: "hybrid"
  name_template: "assets/player_name.png"
  template_threshold: 0.82
  # 找不到人时是否用画面中心当作角色（镜头跟角色时可用）
  fallback_to_frame_center: true
  # 名字通常在角色下方，因此从名字模板中心向上偏移。
  template_center_offset: [0, -55]

behavior:
  profile: "warrior"
  dry_run: true
  startup_delay_seconds: 3
  loop_interval_seconds: 0.03
  target_vertical_tolerance: 110
  move_pulse_seconds: 0.10
  patrol_pulse_seconds: 0.35
  patrol_switch_seconds: 2.5
  jump_when_target_above_pixels: 45
  jump_cooldown_seconds: 1.2
  debug_window: true

ui:
  # GUI 预览目标帧率。1660S 建议 30；2080 Super 可试 60。
  target_fps: 30

profiles:
  warrior:
    attack_key: "ctrl"
    jump_key: "alt"
    attack_range_pixels: 150
    attack_cooldown_seconds: 0.48
    buffs:
      - key: "f1"
        interval_seconds: 180
  priest:
    attack_key: "ctrl"
    jump_key: "alt"
    attack_range_pixels: 180
    attack_cooldown_seconds: 0.75
    buffs:
      - key: "f1"
        interval_seconds: 180

collection:
  output_dir: "captures"
  interval_seconds: 0.35

training:
  base_model: "yolo11n.pt"
  data: "dataset/data.yaml"
  epochs: 100
  image_size: 640
  batch: 8
  workers: 4
  # 不写则跟随 model.device；可单独写成 auto / cuda / cpu / 0
  device: auto
  # 续训默认读取这个权重：runs/mxd_detect/weights/last.pt
  resume_weights: "runs/mxd_detect/weights/last.pt"
