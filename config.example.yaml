# 参数说明书：解释每个配置项的含义、可选值和取值范围。
#
# 程序实际读取的是 config.yaml（已入库，直接改那份）。这里的数值只是通用起点，
# 不需要、也不应该和 config.yaml 保持一致——那边是按本机分辨率和本服画风调过的。
#
# 新增配置项时，两边都要加：config.yaml 加实际值，这里加带注释的默认值。

window:
  title_contains: "MapleStory"
  # 留空表示截取整个客户端区域；也可以限制为 [left, top, width, height]。
  # 抓图默认 mss（屏幕截取），失败才回退 PrintWindow / BitBlt。
  capture_region: null

model:
  weights: "models/best.pt"
  # GUI 会递归扫描该目录中的 .pt，并显示在「模型」下拉框。
  weights_dir: "models"
  # 若预览里几乎没有框，先降到 0.12~0.25 观察；长期仍需用本服截图重训。
  confidence: 0.25
  image_size: 640
  # auto：优先 NVIDIA CUDA，检测不到则 CPU；也可写 cuda / cpu / 0
  device: auto
  tracking_enabled: true
  tracker: "bytetrack.yaml"
  # 可同时写多个：旧模型常用 mob，Roboflow 导出常用 monster。
  monster_classes: ["mob", "monster"]
  player_class: "player"

player:
  # yolo：检测 player 类；template：匹配 assets/player_name.png；hybrid：优先模板，失败时用 YOLO。
  locator: "hybrid"
  name_template: "assets/player_name.png"
  template_threshold: 0.82
  # 找不到人时是否用画面中心当作角色（镜头跟角色时可用）
  fallback_to_frame_center: true
  # 名字搜索：水平全宽，垂直只取中间 40%
  search_center_x_ratio: 1.0
  search_center_y_ratio: 0.40
  # 名字通常在角色下方，因此从名字模板中心向上偏移。
  template_center_offset: [0, -55]

behavior:
  profile: "warrior"
  dry_run: true
  # 独立控制目标进入攻击范围时是否自动按攻击键。
  auto_attack_enabled: true
  startup_delay_seconds: 3
  loop_interval_seconds: 0.03
  # 怪物与人物脚底（框 bottom）的最大高度差；超过时视为不可达。
  target_vertical_tolerance: 140
  # 先选最近怪并锁定，避免每帧换目标导致左右抖动。
  target_match_radius_pixels: 120
  target_lost_grace_seconds: 0.7
  max_chase_horizontal_pixels: 420
  target_acquire_frames: 2
  attack_release_margin_pixels: 40
  action_confirm_frames: 2
  move_pulse_seconds: 0.10
  patrol_pulse_seconds: 0.35
  patrol_switch_seconds: 2.5
  # 怪物脚底比人物脚底高出多少像素，且还不在攻击范围时，触发朝目标跳跃。
  jump_when_target_above_pixels: 45
  jump_cooldown_seconds: 1.2
  debug_window: true

ui:
  # 识别/决策循环上限；实际帧率仍受 YOLO 推理耗时限制。
  target_fps: 30
  # 只限制画面上屏，不影响识别/决策频率。
  preview_fps: 15

profiles:
  warrior:
    attack_key: "ctrl"
    jump_key: "alt"
    left_key: "left"
    right_key: "right"
    up_key: "up"
    down_key: "down"
    hp_potion_key: "1"
    mp_potion_key: "2"
    attack_range_pixels: 220
    attack_cooldown_seconds: 0.40
    buffs:
      - key: "f1"
        interval_seconds: 180
  priest:
    attack_key: "ctrl"
    jump_key: "alt"
    left_key: "left"
    right_key: "right"
    up_key: "up"
    down_key: "down"
    hp_potion_key: "1"
    mp_potion_key: "2"
    attack_range_pixels: 180
    attack_cooldown_seconds: 0.75
    buffs:
      - key: "f1"
        interval_seconds: 180

collection:
  # GUI「开始截图」勾选后，运行期间按间隔保存画面；也可单独跑 collect 命令。
  enabled: false
  output_dir: "captures"
  # 采集间隔（秒）
  interval_seconds: 1.0

# 固定 ROI 自动补血补蓝。标定参考图：assets/vitals_roi_ref.png
vitals:
  enabled: false
  show_overlay: true
  # [left, top, width, height] 相对客户区比例；换分辨率一般不用改。
  hp_roi: [0.1709, 0.9757, 0.0840, 0.0156]
  mp_roi: [0.2559, 0.9757, 0.0830, 0.0156]
  # 低于该比例自动按 profiles.*.hp_potion_key / mp_potion_key
  hp_threshold: 0.40
  mp_threshold: 0.30
  cooldown_seconds: 1.0

training:
  base_model: "yolo11n.pt"
  data: "dataset/data.yaml"
  # 留空：自动输出 models/<data.yaml 所在文件夹名>.pt；也可写 models/xxx.pt。
  output_weights: null
  # 留空：使用输出 pt 的文件名，训练过程位于 runs/<名称>/。
  run_name: null
  epochs: 100
  image_size: 640
  batch: 8
  workers: 4
  # 不写则跟随 model.device；可单独写成 auto / cuda / cpu / 0
  device: auto
  # 留空时自动使用 runs/<本次任务名>/weights/last.pt。
  resume_weights: null
